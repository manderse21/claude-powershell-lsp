name: powershell-lsp attest evidence bundle

# Mike-TRIGGERED, never auto-fires. Builds the measurement evidence bundle from the in-tree
# evidence/v<version>/ tree, attests it with SLSA build provenance, and uploads it as a release
# asset -- all in ONE job on ONE set of bytes, so the artifact that is attested is byte-identical
# to the artifact that is uploaded. (Compress-Archive is not byte-stable across runs, so building
# on a desktop and attesting later would attest a different zip; doing both here removes that gap.)
#
# This is a SIBLING of powershell-lsp-release.yml and reuses its conventions verbatim: pinned action
# SHAs, actions/attest (not the composite wrapper) in provenance mode, the id-token/attestations
# grants, the NODE_OPTIONS carry-over, and dry-run gating where a rehearsal proves assembly but does
# not upload or attest (attestation needs a server-issued OIDC token that a rehearsal cannot mint).

run-name: >-
  attest evidence ${{ inputs.version }}
  ${{ inputs.dry_run && '[DRY-RUN]' || '[PRODUCING]' }}
  target=${{ inputs.commit || 'main' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version whose evidence bundle to attest, MAJOR.MINOR.PATCH (e.g. 1.32.0). The bundle must exist in-tree at evidence/v<version>/."
        required: true
        type: string
        default: "1.32.0"
      commit:
        description: "Commit SHA on main that carries evidence/v<version>/. Leave blank to use the current origin/main tip."
        required: false
        type: string
      dry_run:
        description: "Build the zip and prove assembly + manifest self-check, then STOP without attesting or uploading."
        required: false
        type: boolean
        default: false

# Least-privilege by default: read-only unless a job elevates.
permissions:
  contents: read

concurrency:
  group: powershell-lsp-attest-evidence-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  attest-evidence:
    name: attest-evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # upload the asset to the existing release
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # write the provenance attestation
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve version, tag, and target; confirm the release exists
        id: resolve
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${IN_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$IN_VERSION' is not MAJOR.MINOR.PATCH -- refusing."
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ -n "${IN_COMMIT}" ]]; then
            TARGET="$(git rev-parse "${IN_COMMIT}^{commit}")"
            git checkout --quiet "$TARGET"
          else
            TARGET="$(git rev-parse origin/main)"
          fi
          TAG="v$VERSION"
          # The asset is uploaded to an EXISTING release; do not create one here.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist on $GITHUB_REPOSITORY -- cut the release first."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved evidence for $TAG at $TARGET (dry_run=${{ inputs.dry_run }})."

      - name: Self-check the bundle against its own SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.resolve.outputs.version }}'
          $bundle = "evidence/v$v"
          if (-not (Test-Path -LiteralPath $bundle)) { throw "no evidence bundle at $bundle on this commit" }
          $sums = Join-Path $bundle 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sums)) { throw "SHA256SUMS.txt missing in $bundle" }
          Push-Location $bundle
          try {
            $bad = 0; $n = 0
            Get-Content -LiteralPath 'SHA256SUMS.txt' | Where-Object { $_.Trim() -ne '' } | ForEach-Object {
              $h, $p = $_ -split '\s+', 2
              $have = (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToUpper()
              $n++
              if ($have -ne $h.Trim().ToUpper()) { Write-Host "MISMATCH: $p"; $bad++ }
            }
          } finally { Pop-Location }
          if ($bad -gt 0) { throw "$bad file(s) do not match SHA256SUMS.txt" }
          Write-Host "Self-check OK: $n files match SHA256SUMS.txt."

      - name: Build the evidence zip (bundle contents at zip root) and read it back
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.resolve.outputs.version }}'
          $bundle = "evidence/v$v"
          $zip = "powershell-lsp-evidence-$v.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip -Force

          # Read the written zip back: a truncated or empty archive must not ship green.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = @($z.Entries)
            $names = @($entries | ForEach-Object { $_.FullName })
            Write-Host ('zip entries: ' + $entries.Count)
            if ($names -notcontains 'SHA256SUMS.txt') { throw 'evidence zip is missing SHA256SUMS.txt at its root' }
            if ($entries.Count -lt 10) { throw ('evidence zip has too few entries: ' + $entries.Count) }
            foreach ($e in $entries) {
              if (-not $e.FullName.EndsWith('/') -and $e.Length -le 0) { throw ('empty entry: ' + $e.FullName) }
            }
          } finally { $z.Dispose() }

          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          Write-Host ('built ' + $zip + '  sha256:' + $sha)

      # SLSA build provenance over the evidence zip. Same rationale as release.yml: actions/attest
      # with no predicate/sbom input selects PROVENANCE mode and auto-generates the SLSA
      # build-provenance predicate. NODE_OPTIONS is carried over verbatim from the wrapper.
      - name: Attest build provenance (evidence zip)
        if: ${{ !inputs.dry_run }}
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: powershell-lsp-evidence-${{ steps.resolve.outputs.version }}.zip

      - name: Upload the attested evidence zip to the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          # --clobber so a re-run replaces the asset rather than failing on a name collision.
          gh release upload "$TAG" "powershell-lsp-evidence-$V.zip" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded powershell-lsp-evidence-$V.zip to release $TAG."

      - name: Dry-run summary (no attest, no upload)
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN complete for ${{ steps.resolve.outputs.tag }} on ${{ steps.resolve.outputs.target }}."
          echo "The evidence zip WAS built and its contents self-checked against SHA256SUMS.txt (assembly proven)."
          echo "Nothing was attested or uploaded. Re-run with dry_run=false to produce the attested asset."
