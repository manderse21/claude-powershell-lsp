name: powershell-lsp release

# THE RUN NAME IS LOAD-BEARING, not decoration. dry_run is a workflow_dispatch INPUT, and an input
# does not appear anywhere on the run object -- dispatches 000161 and 000169 both had to recover
# "which run was the dry run?" from run STEPS because of it. Encoding the input into `run-name`
# makes it a STRUCTURAL property of the run: GitHub documents the `inputs` context as available
# here, and the evaluated value lands in the run's own name / display_title. Gate 6 reads exactly
# that. The `target=` field carries the commit input (or HEAD when it was left blank) so a
# rehearsal can be matched to the commit it rehearsed. Keep these markers in sync with
# release/Test-DryRunPair.ps1 -- a test asserts they agree.
run-name: >-
  powershell-lsp release ${{ inputs.version }}
  ${{ inputs.dry_run && '[DRY-RUN]' || '[PRODUCING]' }}
  target=${{ inputs.commit || 'HEAD' }}

# Mike-TRIGGERED, gate-validated release pipeline (dispatch 000042, roadmap Gap C.2).
#
# Governing principle: AUTOMATE THE MECHANICS, PRESERVE THE DECISION. This workflow
# NEVER auto-fires on push or merge -- the ONLY trigger is a manual workflow_dispatch
# Mike runs, choosing the version. It then makes a BAD TAG STRUCTURALLY IMPOSSIBLE:
# it refuses to tag unless the target commit is (1) merged to main, (2) has a free
# tag, (3) is version-matched (plugin.json == marketplace.json == the requested
# version), (4) is GREEN on every push-CI leg, (5) is not behind the version the
# marketplace actually publishes, and (6) has already been REHEARSED by a successful
# dry run of this workflow on this same commit -- and only then cuts and pushes the
# tag ITSELF, on that exact validated commit, and creates the GitHub Release. A tag can
# never land on an unmerged, red, wrong-version, wrong, behind-the-published-tip, or
# unrehearsed commit, because no hand-typed `git tag` is in the loop. Mike keeps the
# release DECISION (when + which version); the pipeline just makes the execution safe.
#
# This enumeration is the gate set, and it is kept in step with the steps below: gate 5
# arrived with dispatch 000076 and gate 6 with 000197, each landing here in the same diff
# as the step it names.
#
# This is a SIBLING of powershell-lsp-ci.yml, not a rewrite of it. See docs/RELEASING.md
# for how to trigger it, what it validates, what it produces, and the manual fallback.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH (e.g. 1.13.0). Must equal plugin.json on the target commit."
        required: true
        type: string
      commit:
        description: "Commit SHA on main to release. Leave blank to use the current origin/main tip."
        required: false
        type: string
      dry_run:
        description: "Validate every precondition and STOP without tagging or releasing (a safe rehearsal)."
        required: false
        type: boolean
        default: false
      skip_dry_check:
        description: "EMERGENCY BYPASS of Gate 6 (the dry-run-pair requirement). Exists so that skipping the rehearsal is a RECORDED run parameter rather than an undetectable omission."
        required: false
        type: boolean
        default: false

# Least-privilege by default: anything not explicitly elevated below is read-only.
permissions:
  contents: read

# One release per version at a time; never cancel a release mid-flight.
concurrency:
  group: powershell-lsp-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: gated-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # cut + push the tag, create the GitHub Release, upload assets
      actions: read         # read the CI workflow runs/jobs for the target commit (the green gate)
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # write the provenance attestation
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve target commit and validate the version string
        id: resolve
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          VERSION="${IN_VERSION#v}"            # tolerate a leading 'v'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$IN_VERSION' is not MAJOR.MINOR.PATCH -- refusing."
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ -n "${IN_COMMIT}" ]]; then
            TARGET="$(git rev-parse "${IN_COMMIT}^{commit}")"
          else
            TARGET="$(git rev-parse origin/main)"
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved target commit $TARGET for tag v$VERSION (dry_run=${{ inputs.dry_run }})."

      - name: "Gate 1 -- target commit is merged to main"
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.resolve.outputs.target }}"
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "::error::commit $TARGET is NOT an ancestor of origin/main (unmerged) -- refusing to tag."
            exit 1
          fi
          echo "OK: $TARGET is merged to main."

      - name: "Gate 2 -- tag does not already exist"
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists -- refusing to re-release (delete the tag deliberately if a re-cut is truly intended)."
            exit 1
          fi
          echo "OK: $TAG is free."

      - name: "Gate 3 -- version lockstep at the target commit (plugin.json == marketplace.json == requested)"
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          TARGET="${{ steps.resolve.outputs.target }}"
          PLUGIN_V="$(git show "$TARGET:.claude-plugin/plugin.json" | jq -r '.version')"
          MARKET_V="$(git show "$TARGET:.claude-plugin/marketplace.json" | jq -r '.metadata.version')"
          echo "requested=$VERSION  plugin.json=$PLUGIN_V  marketplace.json=$MARKET_V"
          if [[ "$PLUGIN_V" != "$VERSION" ]]; then
            echo "::error::plugin.json version ($PLUGIN_V) != requested ($VERSION) at $TARGET -- refusing."
            exit 1
          fi
          if [[ "$MARKET_V" != "$VERSION" ]]; then
            echo "::error::marketplace.json version ($MARKET_V) != requested ($VERSION) at $TARGET -- lockstep drift, refusing."
            exit 1
          fi
          echo "OK: version lockstep holds at the target commit."

      - name: "Gate 4 -- push-CI is GREEN on every leg for the target commit"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.resolve.outputs.target }}"
          CI_WORKFLOW="powershell-lsp-ci.yml"
          # The required matrix legs MIRROR powershell-lsp-ci.yml's matrix.label set. A
          # missing leg is treated as NOT green (refuse) -- the safe failure direction. If
          # the CI matrix gains/loses a leg, update this list (documented in RELEASING.md).
          REQUIRED_LEGS=("windows-pwsh" "windows-powershell" "ubuntu-pwsh" "macos-pwsh")

          RUNS="$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/$CI_WORKFLOW/runs" \
                    -f head_sha="$TARGET" -f event=push --jq '.workflow_runs')"
          COUNT="$(echo "$RUNS" | jq 'length')"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::no push-event CI run found for $TARGET -- cannot confirm green; refusing to tag."
            exit 1
          fi
          RUN_ID="$(echo "$RUNS" | jq -r 'sort_by(.run_number) | last | .id')"
          # Gate 4 must WAIT for the push-CI run to reach a terminal state, THEN judge it --
          # never snapshot-and-refuse. A run still in_progress (not failed, just unfinished)
          # is the common case right after a merge; reading status ONCE there refuses a run
          # about to pass (the proven 28033459348 race). Poll the resolved run by id until it
          # is completed, bounded by a generous timeout sized off the four-leg matrix wall-clock
          # (the windows legs are the long pole); a timeout refuses HONESTLY (never a false green).
          CI_WAIT_TIMEOUT_SECONDS=1800   # 30 min: generous headroom over the matrix wall-clock
          CI_WAIT_POLL_SECONDS=20        # re-query the run every 20s until it reaches a terminal state
          DEADLINE=$(( SECONDS + CI_WAIT_TIMEOUT_SECONDS ))
          RUN_STATUS=""
          RUN_CONCLUSION=""
          while : ; do
            RUN_JSON="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" 2>/dev/null || true)"
            RUN_STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status // empty' 2>/dev/null || true)"
            RUN_CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty' 2>/dev/null || true)"
            echo "push-CI run $RUN_ID for $TARGET: status=${RUN_STATUS:-unknown} conclusion=${RUN_CONCLUSION:-null} (waiting up to ${CI_WAIT_TIMEOUT_SECONDS}s for a terminal state)"
            if [[ "$RUN_STATUS" == "completed" ]]; then
              break
            fi
            if (( SECONDS >= DEADLINE )); then
              echo "::error::push-CI run $RUN_ID for $TARGET did not conclude within ${CI_WAIT_TIMEOUT_SECONDS}s (last status=${RUN_STATUS:-unknown}) -- refusing (honest timeout, NOT a pass)."
              exit 1
            fi
            sleep "$CI_WAIT_POLL_SECONDS"
          done
          if [[ "$RUN_STATUS" != "completed" || "$RUN_CONCLUSION" != "success" ]]; then
            echo "::error::CI run $RUN_ID for $TARGET is not completed+success (status=$RUN_STATUS conclusion=$RUN_CONCLUSION) -- refusing."
            exit 1
          fi
          # Defense in depth: confirm EACH required leg's job concluded success on that run.
          JOBS="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
                    --jq '.jobs[] | {name: .name, conclusion: .conclusion}')"
          echo "Per-leg conclusions:"
          echo "$JOBS"
          for leg in "${REQUIRED_LEGS[@]}"; do
            CONC="$(echo "$JOBS" | jq -r --arg n "$leg" 'select(.name==$n) | .conclusion' | head -n1)"
            if [[ "$CONC" != "success" ]]; then
              echo "::error::required CI leg '$leg' did not succeed (got '${CONC:-MISSING}') for $TARGET -- refusing."
              exit 1
            fi
            echo "OK leg: $leg = success"
          done
          echo "OK: all required CI legs are green for $TARGET."

      - name: "Gate 5 -- tree-vs-published parity (the marketplace-resolved manifest is not behind the release)"
        shell: pwsh
        run: |
          # Build on dispatch 000042: before cutting the tag, assert the PUBLISHED version -- the
          # .claude-plugin/plugin.json on origin/main, the default-branch tip the marketplace resolves
          # (source "./", no ref pin) -- is NOT behind the version being released. This is the
          # tree-vs-published divergence guard (dispatch 000076): it makes the silent drift that served
          # a stale 1.3.0 while the tree was 1.18.x a STRUCTURAL refusal here, not a later surprise.
          ./release/Test-PublishedParity.ps1 -TreeRef "${{ steps.resolve.outputs.target }}" -Ref origin/main

      - name: "Gate 6 -- this producing run is PAIRED with a successful dry run on the same commit"
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.resolve.outputs.target }}"
          SELF_WORKFLOW="powershell-lsp-release.yml"
          THIS_RUN="${{ github.run_id }}"

          # THE WINDOW, and why it is this long. The primary guard is COMMIT IDENTITY: the
          # rehearsal must have run against the exact commit being tagged, so a dry run from an
          # hour ago and one from three days ago validate the same tree equally well. What the
          # window actually bounds is drift in the EXTERNAL state the rehearsal checked but the
          # commit does not pin -- Gate 5 reads origin/main's published manifest, and Gate 4 reads
          # CI runs, both of which can move while the target commit stands still. Three days spans
          # the realistic rehearse-Friday / cut-Monday pattern without letting a producing run lean
          # on a week-old view of main. It is deliberately NOT the main protection; the same-commit
          # requirement is.
          WINDOW_DAYS=3

          if [[ "${{ inputs.skip_dry_check }}" == "true" ]]; then
            echo "::warning::Gate 6 SKIPPED-BY-INPUT -- skip_dry_check=true was passed to this run."
            echo "==============================================================================="
            echo " GATE 6 SKIPPED BY INPUT"
            echo ""
            echo " This producing run was NOT required to have a matching dry run, because"
            echo " skip_dry_check=true was supplied when the workflow was dispatched."
            echo ""
            echo " This is the deliberate emergency bypass. It is loud on purpose: the bypass is a"
            echo " RECORDED run parameter, visible on the run forever, rather than a rehearsal that"
            echo " was quietly never done. If you did not mean to skip the rehearsal, cancel this"
            echo " run and re-dispatch with skip_dry_check=false."
            echo "==============================================================================="
            exit 0
          fi

          echo "Looking for a successful dry run of $SELF_WORKFLOW targeting $TARGET, within $WINDOW_DAYS day(s)."

          # Newest-first; 100 is far more than a 3-day window can hold for a manually dispatched
          # release workflow, so this is bounded without being a silent truncation.
          RUNS_RAW="$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/$SELF_WORKFLOW/runs" \
                        -f event=workflow_dispatch -f per_page=100 \
                        --jq '[ .workflow_runs[] | {id, display_title, name, head_sha, conclusion, created_at, status} ]')"
          TOTAL="$(echo "$RUNS_RAW" | jq 'length')"
          echo "Fetched $TOTAL workflow_dispatch run(s) of this workflow (newest first)."

          # Drop this very run, and anything not completed.
          CANDIDATES="$(echo "$RUNS_RAW" | jq --arg self "$THIS_RUN" \
                          '[ .[] | select((.id|tostring) != $self) | select(.status == "completed") ]')"

          # LEGACY FALLBACK (dispatch 000169's method), for runs created before the run-name marker
          # shipped: a dry run is the one whose "Dry-run summary" step CONCLUDED success, because
          # that step is `if: inputs.dry_run`. A producing run has it `skipped`.
          #
          # SELECTED BY COMMIT IDENTITY, NOT BY RECENCY (dispatch 000217). This used to inspect only
          # the newest 20 unmarked runs and leave every older one UNKNOWN, so a genuine rehearsal
          # expired purely because 20 unrelated runs accumulated behind it -- the v1.30.0 cut
          # announced exactly that at 45 unmarked runs. Raising that cap only moves the cliff out.
          # Selecting on the TARGET COMMIT removes it outright, and removes nothing else: an unmarked
          # run carries no `target=` field, so Test-DryRunPair.ps1 resolves its target to its own
          # head_sha, which means an unmarked run whose head_sha is not $TARGET could never have
          # paired at any cap. Every run this filter drops was already unpairable. What is inspected
          # is now bounded by how often THIS commit was rehearsed rather than by how many runs exist,
          # so it cannot grow with repository age.
          NEEDS_LEGACY="$(echo "$CANDIDATES" | jq -r --arg target "$TARGET" \
            '[ .[] | select(.conclusion == "success")
                   | select(((.display_title // .name // "") | test("\\[DRY-RUN\\]|\\[PRODUCING\\]")) | not)
                   | select(((.head_sha // "") | ascii_downcase) == ($target | ascii_downcase))
                   | .id ] | .[]' || true)"
          UNMARKED_TOTAL="$(echo "$CANDIDATES" | jq \
            '[ .[] | select(.conclusion == "success")
                   | select(((.display_title // .name // "") | test("\\[DRY-RUN\\]|\\[PRODUCING\\]")) | not) ] | length')"
          LEGACY_COUNT="$(echo "$NEEDS_LEGACY" | grep -c . || true)"
          echo "Unmarked successful runs: $UNMARKED_TOTAL in total, of which $LEGACY_COUNT are on target commit $TARGET and are inspected below."
          echo "The other $(( UNMARKED_TOTAL - LEGACY_COUNT )) are on other commits and cannot pair with $TARGET at any age, so they are not inspected. No run is dropped for being old."

          LEGACY_JSON="{}"
          for rid in $NEEDS_LEGACY; do
            SUMMARY_CONC="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$rid/jobs" \
                              --jq '.jobs[].steps[] | select(.name == "Dry-run summary (no tag cut, no release created)") | .conclusion' \
                              2>/dev/null | head -n1 || true)"
            if [[ "$SUMMARY_CONC" == "success" ]]; then
              LEGACY_JSON="$(echo "$LEGACY_JSON" | jq --arg id "$rid" '. + {($id): true}')"
              echo "  legacy run $rid: Dry-run summary = success -> was a DRY RUN"
            elif [[ -n "$SUMMARY_CONC" ]]; then
              LEGACY_JSON="$(echo "$LEGACY_JSON" | jq --arg id "$rid" '. + {($id): false}')"
              echo "  legacy run $rid: Dry-run summary = $SUMMARY_CONC -> was a PRODUCING run"
            else
              echo "  legacy run $rid: no Dry-run summary step found -> UNKNOWN (cannot satisfy the gate)"
            fi
          done

          echo "$CANDIDATES" | jq --argjson legacy "$LEGACY_JSON" \
            '[ .[] | . + (if ($legacy[(.id|tostring)] != null) then {legacyIsDryRun: $legacy[(.id|tostring)]} else {} end) ]' \
            > /tmp/release-runs.json

          echo "Deciding via release/Test-DryRunPair.ps1 (unit-tested; see tests/PowerShellLsp.Release.Tests.ps1):"
          pwsh -NoProfile -File ./release/Test-DryRunPair.ps1 \
            -RunsJsonPath /tmp/release-runs.json \
            -TargetCommit "$TARGET" \
            -WindowDays "$WINDOW_DAYS"

      # ----- All preconditions hold past this point. -----------------------------------

      - name: Check out the validated target commit
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: git checkout --detach "${{ steps.resolve.outputs.target }}"

      - name: Build release notes, source archive, and SBOM
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ steps.resolve.outputs.version }}'
          $target = '${{ steps.resolve.outputs.target }}'

          # Release notes = the CHANGELOG entry, single-sourced (never hand-retyped).
          & ./release/Get-ChangelogEntry.ps1 -Version $v -OutFile release-notes.md

          # The meaningful release artifact for a git-distributed plugin: a deterministic
          # source archive of the EXACT tagged tree (the bytes a consumer installs).
          git archive --format=tar.gz --prefix="powershell-lsp-$v/" -o "powershell-lsp-$v.tar.gz" $target
          if ($LASTEXITCODE -ne 0) { throw "git archive failed ($LASTEXITCODE)" }

          # CycloneDX SBOM over the plugin + its pinned downloaded deps.
          & ./release/New-PluginSbom.ps1 -Version $v -OutFile "powershell-lsp-$v.cdx.json"

          Get-ChildItem "powershell-lsp-$v.tar.gz", "powershell-lsp-$v.cdx.json", "release-notes.md" |
            Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Attest build provenance (archive + SBOM)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            powershell-lsp-${{ steps.resolve.outputs.version }}.tar.gz
            powershell-lsp-${{ steps.resolve.outputs.version }}.cdx.json

      - name: Install gitsign (keyless tag signing, pinned)
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # gitsign signs the release tag with the runner's ambient GitHub OIDC identity --
          # keyless: no stored key, no secret. The certificate is issued by Fulcio and the
          # signature is logged in the public Rekor transparency log. Pinned to a release tag
          # (consistent with the @v-pinned actions above), built from source with the Go
          # toolchain preinstalled on the runner.
          #
          # v0.17.1 is a FLOOR, not a preference (dispatch 000217 leg A). Through v0.16.1 the
          # signer reassembled every object with the COMMIT joiner before hashing it for the
          # Rekor upload (internal/git/git.go LegacySHASign -> pkg/git JoinCommit), while the
          # VERIFIER already dispatched JoinTag for tags (pkg/git/verify.go). For a tag those
          # two disagree, so the entry landed under the hash of a tag-reassembled-as-a-commit
          # and no verifier ever looked it up: v1.29.0, v1.29.1 and v1.30.0 each have a real
          # Rekor entry with a full inclusion proof, keyed where nothing reads. v0.17.0+ routes
          # the signer through the same git.ObjectHashFromSignature helper the verifier uses,
          # so a tag cut from here on is keyed on its REAL tag-object hash and `gitsign
          # verify-tag` can find it. Existing tags are unaffected -- they are not re-signed.
          go install github.com/sigstore/gitsign@v0.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cut and push the gitsign-signed tag FROM the pipeline (keyless, on the validated commit)
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          # Keyless Sigstore signing via the runner's GitHub Actions OIDC identity. This REUSES the
          # id-token: write already granted above for build provenance -- no new permission and no
          # secret. github-actions selects the ambient-OIDC token flow (no browser, no key); the
          # certificate comes from Fulcio and the signature is logged in the public Rekor log.
          GITSIGN_TOKEN_PROVIDER: github-actions
          GITSIGN_FULCIO_URL: https://fulcio.sigstore.dev
          GITSIGN_REKOR_URL: https://rekor.sigstore.dev
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          TARGET="${{ steps.resolve.outputs.target }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Use gitsign as git's x509 signing program, then cut a SIGNED (-s) annotated tag. WHEN
          # the tag is cut is unchanged -- still only here, after Gates 1-4 -- but it now carries a
          # keyless Sigstore signature. (A plain `git verify-tag` needs gitsign to understand this
          # x509/Sigstore signature; see docs/RELEASING.md for the verify path.)
          git config gpg.x509.program gitsign
          git config gpg.format x509
          git tag -s "$TAG" -m "powershell-lsp $TAG" "$TARGET"
          git push origin "refs/tags/$TAG"
          echo "Cut gitsign-signed tag $TAG on $TARGET (keyless via GitHub OIDC, Rekor-logged) and pushed."

      - name: Create the GitHub Release (CHANGELOG notes + SBOM + provenance-attested archive)
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          gh release create "$TAG" \
            --title "powershell-lsp $TAG" \
            --notes-file release-notes.md \
            --target "${{ steps.resolve.outputs.target }}" \
            "powershell-lsp-$V.tar.gz" \
            "powershell-lsp-$V.cdx.json"
          echo "Created GitHub Release $TAG."

      - name: Dry-run summary (no tag cut, no release created)
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN complete: every precondition validated for ${{ steps.resolve.outputs.tag }} on commit ${{ steps.resolve.outputs.target }}."
          echo "No tag was cut and no release was created. Re-run with dry_run=false to publish."
