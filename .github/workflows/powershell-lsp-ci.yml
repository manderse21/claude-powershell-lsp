name: powershell-lsp CI

# Runs the Pester suite for the powershell-lsp plugin on every push / PR to main.
# Matrix: Windows (pwsh 7 + Windows PowerShell 5.1), Ubuntu (pwsh), and macOS (pwsh).
# The integration tests spawn a real PSES daemon over named pipes and now RUN AND
# PASS on Windows, Linux, and macOS alike (named pipes map to Unix domain sockets on
# .NET) -- the cross-platform daemon path that was once "authored, CI-verified later"
# is CI-verified here now; only genuinely unsupported platforms self-skip. (This repo
# IS the plugin, so CI runs on every push -- no path filter, unlike the mande-tooling
# monorepo it was extracted from.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Pinned-PSSA .nupkg cache directory (dispatch 000049). ensure-pssa.ps1 reads
      # POWERSHELL_LSP_PSSA_CACHE and restores/saves the verified .nupkg here; actions/cache
      # (below) persists it across runs keyed by the pin. A path under the workspace so it is
      # per-repo and cleaned with the checkout.
      PSSA_CACHE_DIR: ${{ github.workspace }}/.pssa-nupkg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-pwsh
            os: windows-2025
            interpreter: pwsh
          - label: windows-powershell
            os: windows-2025
            interpreter: powershell
          - label: ubuntu-pwsh
            os: ubuntu-24.04
            interpreter: pwsh
          - label: macos-pwsh
            os: macos-15
            interpreter: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned-PSSA .nupkg cache (dispatch 000049): the structural cure for the 000047 PowerShell
      # Gallery / Azure-CDN egress flake. Restore the pinned, hash-verified PSScriptAnalyzer .nupkg
      # from a cross-run cache so the Gallery is contacted ONLY on a cache miss; the in-script
      # Test-PinnedFileHash pin verify STILL runs on the restored .nupkg before use (a poisoned or
      # stale entry fails closed). The cache KEY binds to the pinned version AND SHA-256 -- resolved
      # from the SINGLE source (scripts/ensure-pssa.ps1) -- so a pin bump can never draw a stale
      # artifact. On a miss the 000047 retry and, behind it, the 000279 pin-gated gallery
      # fallback still vendor, and the run then populates the cache for the next one.
      - name: Resolve PSSA pin (cache key binds to version + SHA-256)
        id: pin
        shell: pwsh
        run: ./scripts/print-pssa-pin.ps1 >> $env:GITHUB_OUTPUT

      - name: Cache pinned PSScriptAnalyzer .nupkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PSSA_CACHE_DIR }}
          key: pssa-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Run Pester suite
        env:
          # Pin the integration test's data root to a workspace path so the warm
          # daemon's own logs (pses-daemon.log, pses-server-*.log, pses-stderr-*.log)
          # are uploadable as a diagnostic artifact below -- without this the hosted
          # CI harness never surfaces them, which is exactly what blocked debugging
          # the ubuntu-pwsh bring-up failure.
          PSLS_TEST_DATA_DIR: ${{ github.workspace }}/psls-test-data
          # The vendoring inside the test BeforeAll blocks (& pwsh ensure-pssa.ps1) reads this and
          # restores the pinned .nupkg from the cache above on a hit -- so on a warm cache the
          # Gallery is not contacted, yet the pin is still verified before use (dispatch 000049).
          POWERSHELL_LSP_PSSA_CACHE: ${{ env.PSSA_CACHE_DIR }}
          # Emitted-SARIF dump (dispatch 000159 leg 1b). The suite writes the SARIF it emits
          # here so the 5.1 leg's output can be schema-validated by a pwsh step below --
          # Test-Json -Schema does not exist on Windows PowerShell 5.1, so the three in-suite
          # conformance cases correctly SKIP there, leaving the serializer most likely to
          # deviate as the one host never checked. The emission stays on 5.1; only the
          # validator moves. The in-suite skips are unchanged and still correct.
          POWERSHELL_LSP_SARIF_ARTIFACT_DIR: ${{ github.workspace }}/psls-sarif-emitted
        run: ${{ matrix.interpreter }} -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1 -CI

      # Validate the SARIF the suite EMITTED against the vendored 2.1.0 schema, from pwsh.
      # -RequireHost 5 is the vacuity guard: if the 5.1 leg wrote no artifact, this FAILS
      # rather than passing over an empty set -- green must mean "5.1's SARIF was checked".
      # Runs on the windows-powershell leg only; every other leg is pwsh and already
      # validates in-process, where a failure names the offending It block directly.
      - name: Validate 5.1-emitted SARIF against the vendored schema
        if: always() && matrix.label == 'windows-powershell'
        shell: pwsh
        run: >-
          ./tests/validate-sarif-artifacts.ps1
          -Path "${{ github.workspace }}/psls-sarif-emitted"
          -Schema ./tests/sarif/sarif-2.1.0.json
          -RequireHost 5

      # RECORD-ONLY POSIX measurement (dispatch 000276 leg F, Mike's ruling Q4 of 2026-09-05).
      # THREAT-MODEL.md carries T5.1 (daemon pipe permissions) and T6.2 (data-root temp
      # fallback permissions) as measured on WINDOWS ONLY, and says in its own words that the
      # POSIX arm is "a derivation from platform convention, not a measurement". This step takes
      # the observation on the two POSIX legs so the rows can carry a measured value.
      #
      # It is NOT a gate. The script never fails on a measured value -- a permissive mode is a
      # finding for the record and for the maintainer, not a red build. It fails ONLY when the
      # JSON was not written or does not parse, which is the same vacuity discipline as the
      # -RequireHost guard above: green must mean the measurement happened.
      #
      # Additive: no runtime script changed, no new required gate, and the four leg identities
      # are untouched.
      - name: Measure POSIX pipe and data-root surface (record-only)
        if: always() && (matrix.label == 'ubuntu-pwsh' || matrix.label == 'macos-pwsh')
        shell: pwsh
        env:
          PSLS_TEST_DATA_DIR: ${{ github.workspace }}/psls-test-data
          POWERSHELL_LSP_PSSA_CACHE: ${{ env.PSSA_CACHE_DIR }}
        run: >-
          ./tests/measure-posix-surface.ps1
          -OutputPath "${{ github.workspace }}/psls-test-data/posix-surface/posix-surface-${{ matrix.label }}.json"

      - name: Upload emitted SARIF artifacts
        if: always() && matrix.label == 'windows-powershell'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-emitted-${{ matrix.label }}
          path: psls-sarif-emitted/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-${{ matrix.label }}
          path: tests/testResults.xml
          if-no-files-found: ignore

      - name: Upload daemon logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-logs-${{ matrix.label }}
          path: |
            psls-test-data/logs/**
            psls-test-data/session/**
            psls-test-data/posix-surface/**
          if-no-files-found: ignore

      # The performance benchmark harness (dispatch 000040) emits its measured
      # cold-start / warm-path numbers here; surface them as a first-class artifact
      # so per-leg latency is downloadable for characterizing and later tightening
      # the (deliberately generous) regression thresholds.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ matrix.label }}
          path: psls-test-data/logs/benchmark-results.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # THE CONTAINER LEG (dispatch 000286, enterprise docket P2-3, item 16).
  #
  # ITS OWN JOB, WITH ITS OWN NAME, DELIBERATELY. The obvious implementation is a fifth entry in
  # the matrix above, and it is the wrong one: the pester job's name is `${{ matrix.label }}`, so
  # adding a container dimension would re-key the existing legs and RENAME their check contexts.
  # A required check that never reports again is a required check silently removed. The four leg
  # identities -- windows-pwsh, windows-powershell, ubuntu-pwsh, macos-pwsh -- are untouched here
  # by construction, because nothing above this line changed.
  #
  # WHY CHECKOUT ON THE HOST AND MOUNT, RATHER THAN A JOB-LEVEL `container:`. The official
  # PowerShell image ships no git (nor curl, dotnet, or unzip -- measured). Under `container:`,
  # actions/checkout runs INSIDE the image, finds no git, and falls back to a REST tarball, which
  # yields a working tree with no .git at all. Checking out on the host and mounting the workspace
  # keeps a real repository -- which the ControlMapClaims provenance assertion reads -- while the
  # plugin itself still runs entirely inside the container.
  #
  # WHY 7.5-ubuntu-24.04 AND NOT :latest. Measured, not assumed: PSScriptAnalyzer 1.25.0 -- this
  # repository's pin -- refuses to import below PowerShell 7.4.6, and `powershell:latest` is
  # 7.4.2. Under :latest the analyzer never loads, so the corpus tier returns EMPTY findings and
  # the daemon tier never returns an analysis: 41 corpus failures and 13 integration failures,
  # every one of them an artefact of the image rather than of this repository. On
  # 7.5-ubuntu-24.04 (7.5.0) the same tree runs 266/0 and 66/0. Pinned by digest, in this
  # repository's immutable-pinning idiom.
  #
  # NON-ROOT is the posture being proven, and `--user $(id -u):$(id -g)` is what makes it both
  # non-root AND able to write the workspace it was handed: the runner user owns the checkout, so
  # borrowing a hard-coded uid would fail on permissions rather than on anything meaningful.
  container-pwsh:
    name: container-pwsh
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the container identity (pinned by digest)
        run: |
          docker pull "$IMAGE"
          echo "resolved:"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}'
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp "$IMAGE" \
            pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
        env:
          IMAGE: mcr.microsoft.com/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81

      # The suite, inside the container: non-root, no TTY (docker run without -t), no profile
      # (-NoProfile), Pester installed in-job by tests/run-tests.ps1 itself.
      #
      # TWO FLAGS HERE ARE LOAD-BEARING, and CI taught both of them -- the first run of this leg
      # went red on exactly two tests that pass on all four other legs and passed in a local
      # container too, because the local invocation happened to differ from this one in both ways.
      #
      # --init: without it, pwsh is PID 1. Get-ProcessTreePids walks DOWNWARD from the test host,
      # and in a container everything is parented to PID 1 -- so the D4 control asserting that "an
      # UNRELATED process is NOT excluded" found its synthetic foreign pid legitimately inside the
      # subtree and failed with `collection @(1, 914, 999003, 999004)`. That is the leg violating a
      # reasonable assumption of the test, not a defect in the test, so the leg is what changes:
      # --init puts a real init at PID 1 and makes pwsh its child. (It is also correct on its own
      # terms -- signal handling and zombie reaping.)
      #
      # HOME ON A TMPFS, OUTSIDE THE WORKSPACE: run-tests.ps1 installs Pester to the CurrentUser
      # scope, i.e. under $HOME. Pointing HOME inside the mounted workspace put Pester's own SOURCE
      # inside the repository tree, and the repo-wide scans then walked it -- the G3 scalar-.Count
      # ratchet failed naming `.container-home/.local/share/powershell/Modules/Pester/5.9.1/
      # Pester.psm1:10410`. A tree that a test scans must not contain the harness that scans it.
      # PSLS_TEST_DATA_DIR deliberately stays under the workspace, matching the four existing legs,
      # so the daemon logs remain uploadable below.
      - name: Run the Pester suite in the official PowerShell container
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/psls-test-data"
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --tmpfs /ctr:exec,mode=1777 \
            -e HOME=/ctr/home \
            -e PSLS_TEST_DATA_DIR=/work/psls-test-data \
            -e POWERSHELL_LSP_PSSA_CACHE=/work/.pssa-nupkg-cache \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "$IMAGE" \
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/run-tests.ps1 -CI
        env:
          IMAGE: mcr.microsoft.com/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81

      # The doctor's CENSUS, asserted explicitly rather than gated on -RequireProven.
      #
      # -RequireProven CANNOT pass in a container and no change here can make it: six of its eight
      # unknowns are unknowable outside a live Claude Code plugin subprocess, one reports the
      # shipped offline default, and one is unknown BY DESIGN while ps_host is default. Gating on
      # it would gate on a value the leg cannot reach. So the leg pins the KNOWN posture instead --
      # zero failures, check 1 naming the REAL in-process version, the exact unknown set, and
      # -RequireProven exiting 2 rather than 0 or 1. Restoring the pre-000285 probe turns this red
      # on seven counts, including check 1 reporting "found pwsh 0.0.0.0" on a 7.5.0 host, which
      # is the defect that blocked this whole slice.
      - name: Assert the doctor census in the container
        if: always()
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --tmpfs /ctr:exec,mode=1777 \
            -e HOME=/ctr/home \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "$IMAGE" \
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/assert-container-doctor.ps1
        env:
          IMAGE: mcr.microsoft.com/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-container-pwsh
          path: tests/testResults.xml
          if-no-files-found: ignore

      - name: Upload daemon logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-logs-container-pwsh
          path: |
            psls-test-data/logs/**
            psls-test-data/session/**
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------
  # claude-code-compat -- P1-3's REGISTRATION half (dispatch 000287; docket P1-3, review item 4).
  #
  # ITS OWN JOB WITH ITS OWN NAME, for the reason the container leg is: the `pester` job above is
  # named ${{ matrix.label }}, so a new dimension there would re-key the four legs it covers and
  # RENAME their check contexts, silently removing required checks. Nothing above this line is
  # touched. The five existing identities -- windows-pwsh, windows-powershell, ubuntu-pwsh,
  # macos-pwsh, container-pwsh -- are unchanged.
  #
  # ADVISORY, NOT REQUIRED, and that is a ruling rather than a preference: R-G, ruled 2026-09-05,
  # verbatim -- "Claude Code Current-1 is Advisory, not Required." A required leg that cannot
  # obtain an older client blocks every release, which trades one enterprise risk for a worse one.
  # `continue-on-error: true` is what makes that ruling true of the job rather than only of the
  # prose about it.
  #
  # WHAT IT PROVES, AND WHAT IT DOES NOT. It proves a REAL CLIENT, at a pinned version, registers
  # this plugin's components -- reading our own manifest back to ourselves would prove only that
  # the file we wrote is the file we wrote. It does NOT prove a diagnostic surfaces: that needs a
  # live agent turn and therefore a credential, which this repository does not hold and this leg
  # does not fabricate. So NO `claudeCodeCompatibility` block is written from this: the docket
  # requires the declaration be "written from what the matrix proved, never ahead of it", and
  # docs/SUPPORT-POLICY.md refuses to declare an untested floor in so many words.
  #
  # THE VERSIONS ARE PINNED, not resolved at run time, because "obtaining and pinning two client
  # versions" is the slice's stated work and `latest` is not a pin. Measured from the npm registry
  # on 2026-09-08: dist-tags were latest=2.1.263, stable=2.1.236, and the published versions
  # immediately below latest were 2.1.261 and 2.1.260. Current = 2.1.263; Current-1 = 2.1.261.
  #
  # CLAUDE_CONFIG_DIR is deliberately OUTSIDE the workspace. That is the 000286 container lesson
  # applied ahead of the failure rather than after it: a client config inside the checkout puts
  # installed plugin files into the tree this repository's own repo-wide scans walk.
  claude-code-compat:
    name: claude-code-compat
    runs-on: ubuntu-24.04
    continue-on-error: true      # ADVISORY per ruling R-G
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: '22'

      - name: Register and enumerate under Claude Code 2.1.263 (Current)
        env:
          CLAUDE_CODE_VERSION: '2.1.263'
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ccconfig-current
        # `bash <script>` and not `./<script>`: this repository is authored on Windows, where the
        # executable bit is not a property of the filesystem, so a shell script can reach git as
        # mode 100644 and the runner answers with exit 126 -- "command found, not executable" --
        # before a single line of it runs. That is exactly what happened on this leg's first run.
        # The bit is set in the index as well; invoking through bash is what makes losing it again
        # a non-event rather than a repeat.
        run: bash ./.github/scripts/claude-code-compat.sh

      - name: Register and enumerate under Claude Code 2.1.261 (Current-1)
        if: always()
        env:
          CLAUDE_CODE_VERSION: '2.1.261'
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ccconfig-prev
        # `bash <script>` and not `./<script>`: this repository is authored on Windows, where the
        # executable bit is not a property of the filesystem, so a shell script can reach git as
        # mode 100644 and the runner answers with exit 126 -- "command found, not executable" --
        # before a single line of it runs. That is exactly what happened on this leg's first run.
        # The bit is set in the index as well; invoking through bash is what makes losing it again
        # a non-event rather than a repeat.
        run: bash ./.github/scripts/claude-code-compat.sh

      - name: Upload the client inventories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-code-inventory
          path: claude-code-details-*.txt
          if-no-files-found: ignore
