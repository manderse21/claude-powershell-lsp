name: powershell-lsp CI

# Runs the Pester suite for the powershell-lsp plugin on every push / PR to main.
# Matrix: Windows (pwsh 7 + Windows PowerShell 5.1), Ubuntu (pwsh), and macOS (pwsh).
# The integration tests spawn a real PSES daemon over named pipes and now RUN AND
# PASS on Windows, Linux, and macOS alike (named pipes map to Unix domain sockets on
# .NET) -- the cross-platform daemon path that was once "authored, CI-verified later"
# is CI-verified here now; only genuinely unsupported platforms self-skip. (This repo
# IS the plugin, so CI runs on every push -- no path filter, unlike the mande-tooling
# monorepo it was extracted from.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Pinned-PSSA .nupkg cache directory (dispatch 000049). ensure-pssa.ps1 reads
      # POWERSHELL_LSP_PSSA_CACHE and restores/saves the verified .nupkg here; actions/cache
      # (below) persists it across runs keyed by the pin. A path under the workspace so it is
      # per-repo and cleaned with the checkout.
      PSSA_CACHE_DIR: ${{ github.workspace }}/.pssa-nupkg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-pwsh
            os: windows-2025
            interpreter: pwsh
          - label: windows-powershell
            os: windows-2025
            interpreter: powershell
          - label: ubuntu-pwsh
            os: ubuntu-24.04
            interpreter: pwsh
          - label: macos-pwsh
            os: macos-15
            interpreter: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned-PSSA .nupkg cache (dispatch 000049): the structural cure for the 000047 PowerShell
      # Gallery / Azure-CDN egress flake. Restore the pinned, hash-verified PSScriptAnalyzer .nupkg
      # from a cross-run cache so the Gallery is contacted ONLY on a cache miss; the in-script
      # Test-PinnedFileHash pin verify STILL runs on the restored .nupkg before use (a poisoned or
      # stale entry fails closed). The cache KEY binds to the pinned version AND SHA-256 -- resolved
      # from the SINGLE source (scripts/ensure-pssa.ps1) -- so a pin bump can never draw a stale
      # artifact. On a miss the 000047 retry and, behind it, the 000279 pin-gated gallery
      # fallback still vendor, and the run then populates the cache for the next one.
      - name: Resolve PSSA pin (cache key binds to version + SHA-256)
        id: pin
        shell: pwsh
        run: ./scripts/print-pssa-pin.ps1 >> $env:GITHUB_OUTPUT

      - name: Cache pinned PSScriptAnalyzer .nupkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PSSA_CACHE_DIR }}
          key: pssa-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Run Pester suite
        env:
          # Pin the integration test's data root to a workspace path so the warm
          # daemon's own logs (pses-daemon.log, pses-server-*.log, pses-stderr-*.log)
          # are uploadable as a diagnostic artifact below -- without this the hosted
          # CI harness never surfaces them, which is exactly what blocked debugging
          # the ubuntu-pwsh bring-up failure.
          PSLS_TEST_DATA_DIR: ${{ github.workspace }}/psls-test-data
          # The vendoring inside the test BeforeAll blocks (& pwsh ensure-pssa.ps1) reads this and
          # restores the pinned .nupkg from the cache above on a hit -- so on a warm cache the
          # Gallery is not contacted, yet the pin is still verified before use (dispatch 000049).
          POWERSHELL_LSP_PSSA_CACHE: ${{ env.PSSA_CACHE_DIR }}
          # Emitted-SARIF dump (dispatch 000159 leg 1b). The suite writes the SARIF it emits
          # here so the 5.1 leg's output can be schema-validated by a pwsh step below --
          # Test-Json -Schema does not exist on Windows PowerShell 5.1, so the three in-suite
          # conformance cases correctly SKIP there, leaving the serializer most likely to
          # deviate as the one host never checked. The emission stays on 5.1; only the
          # validator moves. The in-suite skips are unchanged and still correct.
          POWERSHELL_LSP_SARIF_ARTIFACT_DIR: ${{ github.workspace }}/psls-sarif-emitted
        run: ${{ matrix.interpreter }} -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1 -CI

      # Validate the SARIF the suite EMITTED against the vendored 2.1.0 schema, from pwsh.
      # -RequireHost 5 is the vacuity guard: if the 5.1 leg wrote no artifact, this FAILS
      # rather than passing over an empty set -- green must mean "5.1's SARIF was checked".
      # Runs on the windows-powershell leg only; every other leg is pwsh and already
      # validates in-process, where a failure names the offending It block directly.
      - name: Validate 5.1-emitted SARIF against the vendored schema
        if: always() && matrix.label == 'windows-powershell'
        shell: pwsh
        run: >-
          ./tests/validate-sarif-artifacts.ps1
          -Path "${{ github.workspace }}/psls-sarif-emitted"
          -Schema ./tests/sarif/sarif-2.1.0.json
          -RequireHost 5

      # RECORD-ONLY POSIX measurement (dispatch 000276 leg F, Mike's ruling Q4 of 2026-09-05).
      # THREAT-MODEL.md carries T5.1 (daemon pipe permissions) and T6.2 (data-root temp
      # fallback permissions) as measured on WINDOWS ONLY, and says in its own words that the
      # POSIX arm is "a derivation from platform convention, not a measurement". This step takes
      # the observation on the two POSIX legs so the rows can carry a measured value.
      #
      # It is NOT a gate. The script never fails on a measured value -- a permissive mode is a
      # finding for the record and for the maintainer, not a red build. It fails ONLY when the
      # JSON was not written or does not parse, which is the same vacuity discipline as the
      # -RequireHost guard above: green must mean the measurement happened.
      #
      # Additive: no runtime script changed, no new required gate, and the four leg identities
      # are untouched.
      - name: Measure POSIX pipe and data-root surface (record-only)
        if: always() && (matrix.label == 'ubuntu-pwsh' || matrix.label == 'macos-pwsh')
        shell: pwsh
        env:
          PSLS_TEST_DATA_DIR: ${{ github.workspace }}/psls-test-data
          POWERSHELL_LSP_PSSA_CACHE: ${{ env.PSSA_CACHE_DIR }}
        run: >-
          ./tests/measure-posix-surface.ps1
          -OutputPath "${{ github.workspace }}/psls-test-data/posix-surface/posix-surface-${{ matrix.label }}.json"

      - name: Upload emitted SARIF artifacts
        if: always() && matrix.label == 'windows-powershell'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-emitted-${{ matrix.label }}
          path: psls-sarif-emitted/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-${{ matrix.label }}
          path: tests/testResults.xml
          if-no-files-found: ignore

      - name: Upload daemon logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-logs-${{ matrix.label }}
          path: |
            psls-test-data/logs/**
            psls-test-data/session/**
            psls-test-data/posix-surface/**
          if-no-files-found: ignore

      # The performance benchmark harness (dispatch 000040) emits its measured
      # cold-start / warm-path numbers here; surface them as a first-class artifact
      # so per-leg latency is downloadable for characterizing and later tightening
      # the (deliberately generous) regression thresholds.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ matrix.label }}
          path: psls-test-data/logs/benchmark-results.json
          if-no-files-found: ignore
